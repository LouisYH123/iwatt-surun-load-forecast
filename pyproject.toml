[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iwatt-surun-load-forecast"
version = "1.0.0"
description = "SuRun Jiangsu aggregate load-forecast research and backtests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "iWatt" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = [
  "catboost>=1.2",
  "lightgbm>=4.0",
  "xgboost>=2.0",
]
foundation = [
  "torch>=2.2",
  "huggingface-hub>=0.24",
  "chronos-forecasting>=1.4",
]

[tool.setuptools.packages.find]
include = ["project*"]
